name: Upstream sync

# WYRE-AI fork: weekly merge of Softeria/ms-365-mcp-server main into a sync
# branch. Merge (never rebase), run the app-only tests, and open a DRAFT PR
# labelled `hold` only when the merge is clean and the tests pass.
#
# Notes:
# - PRs opened with GITHUB_TOKEN do not trigger other workflows; re-run CI on
#   the PR (close/reopen or workflow_dispatch) before review.
# - GITHUB_TOKEN cannot push commits that change .github/workflows/. If
#   upstream changed a workflow the push step fails and the sync must be done
#   by hand (or with a GitHub App token, which is not configured).
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'WYRE-AI/ms-365-mcp-server'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the draft PR
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Softeria/ms-365-mcp-server.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "Already up to date with upstream $UPSTREAM_SHA"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="sync/upstream-${UPSTREAM_SHA:0:12}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Sync branch $BRANCH already exists"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$BRANCH"
          # A conflict fails the job here: no branch is pushed and no PR opened.
          git merge --no-ff --no-edit -m "chore: merge upstream Softeria/ms-365-mcp-server@${UPSTREAM_SHA:0:12}" upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 24.x
          cache: npm

      - name: Verify (app-only tests plus upstream checks)
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run generate
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run test/app-only

      - name: Push sync branch and open draft PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git push origin "$BRANCH"
          gh label create hold --color B60205 --description "Do not merge" 2>/dev/null || true
          gh pr create --draft --base main --head "$BRANCH" --label hold \
            --title "chore: sync upstream Softeria/ms-365-mcp-server@${UPSTREAM_SHA:0:12}" \
            --body "Automated weekly merge of upstream main (${UPSTREAM_SHA}) into the fork. The merge was clean and the app-only tests passed on the merge commit. Review the upstream changes for anything that touches the hooks in src/index.ts / src/cli.ts or the app-only surface, then re-run CI before marking ready."
